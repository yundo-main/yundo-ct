<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>그림판</title>
<style>
:root{--bg:#dfe7f1;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#d5deea;--accent:#2563eb;--soft:#f4f7fb;--hover:#e6edf6;--sel:#dbeafe;--head1:#16324f;--head2:#1f4e79;--shadow:0 1px 3px rgba(15,23,42,.12)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--panel:#1b2638;--ink:#e5eaf3;--muted:#94a3b8;--line:#2a3a52;--accent:#3b82f6;--soft:#223048;--hover:#2d4263;--sel:#2f5381;--head1:#0f1e33;--head2:#14304f;--shadow:0 1px 3px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0f1624;--panel:#1b2638;--ink:#e5eaf3;--muted:#94a3b8;--line:#2a3a52;--accent:#3b82f6;--soft:#223048;--hover:#2d4263;--sel:#2f5381;--head1:#0f1e33;--head2:#14304f;--shadow:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:13px/1.4 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow:hidden;user-select:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}
header{display:flex;align-items:center;gap:6px;padding:8px 12px;background:linear-gradient(90deg,var(--head1),var(--head2));color:#fff;flex:none}
header b{margin-right:10px;font-size:14px}
header .sep{width:1px;height:22px;background:rgba(255,255,255,.25);margin:0 6px}
header button{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:6px 10px;min-height:32px}
header button:hover:not(:disabled){background:rgba(255,255,255,.28)}
header button:disabled{opacity:.4;cursor:default}
#fileName{margin-left:auto;opacity:.9;font-size:12px;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app{flex:1;min-height:0;display:flex}
.side{width:208px;flex:none;overflow-y:auto;overflow-x:hidden;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.card{background:var(--panel);border-radius:10px;padding:10px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:11px;letter-spacing:.4px;color:var(--muted);font-weight:600}
.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
#paper.pix canvas{image-rendering:pixelated}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border:1px solid var(--line);background:var(--soft);border-radius:9px;font-size:11px}
.tool:hover{background:var(--hover)}
.tool.on{background:var(--sel);border-color:var(--accent);font-weight:600}
.row{display:flex;align-items:center;gap:8px}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
input[type=number]{width:54px;border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:4px 6px}
#preview{height:44px;margin-top:8px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--soft)}
#preview i{display:block;border-radius:50%}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sw button{aspect-ratio:1;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px #94a3b8;padding:0}
.sw button.on{box-shadow:0 0 0 2px var(--accent)}
#color{width:100%;height:30px;margin-top:8px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--soft)}
.radios{display:grid;gap:4px}
.radios label{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:7px;cursor:pointer}
.radios label:hover{background:var(--hover)}
.radios i{width:16px;height:16px;border-radius:4px;border:1px solid #94a3b8;display:inline-block}
.stageWrap{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:var(--rw,0) 1fr;grid-template-rows:var(--rh,0) 1fr}
.stageWrap.rulers{--rw:28px;--rh:20px}
.stageWrap canvas.ruler,.stageWrap .corner{display:none;background:var(--panel)}
.stageWrap.rulers canvas.ruler,.stageWrap.rulers .corner{display:block}
.corner{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#rulerH{width:100%;height:100%;grid-column:2;grid-row:1;border-bottom:1px solid var(--line)}
#rulerV{width:100%;height:100%;grid-column:1;grid-row:2;border-right:1px solid var(--line)}
.stage{grid-column:2;grid-row:2;min-width:0;min-height:0;overflow:auto;padding:16px}
#gridLayer{position:absolute;inset:0;pointer-events:none;display:none}
#paper.grid #gridLayer{display:block}
.fb{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.fb button{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb button:hover{background:var(--hover)}
#fbPath{font-size:11px;color:var(--muted);word-break:break-all;margin-bottom:6px}
footer input[type=range]{width:120px;accent-color:var(--accent)}
footer button{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:1px 8px;line-height:1.4}
footer .zoomBox{display:flex;align-items:center;gap:6px}
#pct{min-width:4ch;text-align:right}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:7px 12px;border-bottom:2px solid transparent;color:var(--muted);border-radius:0}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
#help{width:min(560px,92vw)}
#help .body{max-height:52vh;overflow:auto;color:var(--ink);line-height:1.6}
#help table{border-collapse:collapse;width:100%}
#help td{padding:4px 8px;border-bottom:1px solid var(--line)}
#help td:last-child{color:var(--muted);text-align:right;white-space:nowrap}
#help h4{margin:12px 0 4px}
#paper{position:relative;display:inline-block;box-shadow:0 4px 18px rgba(15,23,42,.3);line-height:0;background:#fff}
#paper.checker{background:conic-gradient(#d9d9d9 25%,#fff 0 50%,#d9d9d9 0 75%,#fff 0) 0 0/16px 16px}
#cv{display:block}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#paper.t-text #ov{cursor:text}#paper.t-fill #ov{cursor:cell}
#te{position:absolute;z-index:3;margin:0;padding:0;border:1px dashed var(--accent);outline:0;background:transparent;resize:both;overflow:hidden;white-space:pre;line-height:1.25;min-width:120px;user-select:text}
.opt{display:flex;align-items:center;gap:8px;margin-top:8px}
.opt:first-of-type{margin-top:0}
.opt select,.opt input[type=number]{flex:1;min-width:0;border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:4px 6px}
.opt label{display:flex;align-items:center;gap:6px}
[hidden]{display:none!important}
footer{display:flex;gap:16px;align-items:center;padding:5px 12px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:12px;flex:none}
footer .credit{margin-left:auto}
dialog{border:0;border-radius:14px;padding:20px;background:var(--panel);color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.35);min-width:300px}
dialog::backdrop{background:rgba(2,6,23,.5)}
dialog h2{margin:0 0 10px;font-size:15px}
dialog p{margin:0 0 14px;color:var(--muted)}
dialog .fields{display:flex;gap:10px;margin-bottom:14px}
dialog label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
dialog input[type=number]{width:100px;padding:7px}
dialog .btns{display:flex;gap:8px;justify-content:flex-end}
dialog button{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:7px 14px}
dialog button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:8px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

<header>
 <b>그림판</b>
 <button id="bNew" title="새로 만들기 (Ctrl+N)"><svg class="i"><use href="#i-new"/></svg>새로 만들기</button>
 <button id="bOpen" title="열기 (Ctrl+O)"><svg class="i"><use href="#i-open"/></svg>열기</button>
 <button id="bSave" title="저장 (Ctrl+S)"><svg class="i"><use href="#i-save"/></svg>저장</button>
 <button id="bCopy" title="클립보드로 복사 (Ctrl+Shift+C) — 선택 영역이 있으면 그 부분만"><svg class="i"><use href="#i-copy"/></svg>클립보드 복사</button>
 <button id="bSaveAs" title="다른 이름으로 저장 (Ctrl+Shift+S)"><svg class="i"><use href="#i-saveas"/></svg>다른 이름으로</button>
 <span class="sep"></span>
 <button id="bUndo" title="실행 취소 (Ctrl+Z)"><svg class="i"><use href="#i-undo"/></svg>실행 취소</button>
 <button id="bRedo" title="다시 실행 (Ctrl+Y)"><svg class="i"><use href="#i-redo"/></svg>다시 실행</button>
 <span id="fileName"></span>
 <button id="bBrowser" title="파일 브라우저 (Ctrl+B)"><svg class="i"><use href="#i-folder"/></svg>파일 브라우저</button>
 <button id="bHelp" title="도움말 (F1)" aria-label="도움말"><svg class="i"><use href="#i-help"/></svg></button>
 <button id="bTheme" aria-label="테마 전환" title="화면 테마"></button>
</header>
<div class="app">
 <aside class="side">
  <div class="card"><h3>도구</h3><div class="tools" id="tools">
   <button class="tool on" data-tool="pen" title="연필 (P)"><svg class="i"><use href="#i-pen"/></svg>연필</button>
   <button class="tool" data-tool="brush" title="브러시 (B)"><svg class="i"><use href="#i-brush"/></svg>브러시</button>
   <button class="tool" data-tool="eraser" title="지우개 (E)"><svg class="i"><use href="#i-eraser"/></svg>지우개</button>
   <button class="tool" data-tool="line" title="직선 (L)"><svg class="i"><use href="#i-line"/></svg>직선</button>
   <button class="tool" data-tool="rect" title="사각형 (R)"><svg class="i"><use href="#i-rect"/></svg>사각형</button>
   <button class="tool" data-tool="ellipse" title="타원 (O)"><svg class="i"><use href="#i-ellipse"/></svg>타원</button>
   <button class="tool" data-tool="text" title="텍스트 (T)"><svg class="i"><use href="#i-text"/></svg>텍스트</button>
   <button class="tool" data-tool="fill" title="색 채우기 (F)"><svg class="i"><use href="#i-fill"/></svg>색 채우기</button>
   <button class="tool" data-tool="pick" title="색 선택 (I)"><svg class="i"><use href="#i-pick"/></svg>색 선택</button>
   <button class="tool" data-tool="move" title="이동 (M) — 글씨·도형·획을 끌어서 옮깁니다"><svg class="i"><use href="#i-move"/></svg>이동</button>
   <button class="tool" data-tool="select" title="선택 (S)"><svg class="i"><use href="#i-select"/></svg>선택</button>
   <button class="tool" data-tool="cutrect" title="영역 삭제 (D)"><svg class="i"><use href="#i-cutrect"/></svg>영역 삭제</button>
   <button class="tool" id="tDelSel" title="선택 영역 삭제 (Delete)" disabled><svg class="i"><use href="#i-trash"/></svg>선택 삭제</button>
  </div></div>
  <div class="card"><h3>굵기</h3>
   <div class="row"><input type="range" id="w" min="1" max="80" value="4" aria-label="굵기"><input type="number" id="wNum" min="1" max="80" value="4" aria-label="굵기 숫자"></div>
   <div id="preview"><i id="prevDot"></i></div></div>
  <div class="card" id="optCard" hidden><h3 id="optTitle">옵션</h3>
   <div class="opt" id="optFill" hidden><label><input type="checkbox" id="fillShape"> 도형 안을 색으로 채우기</label></div>
   <div id="optText" hidden>
    <div class="opt"><select id="fontFam" aria-label="글꼴"><option value="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">기본 고딕</option><option value="'Nanum Myeongjo','Batang',serif">명조(세리프)</option><option value="Menlo,Consolas,monospace">고정폭</option><option value="Arial,Helvetica,sans-serif">Arial</option></select></div>
    <div class="opt"><span>크기</span><input type="number" id="fontSize" min="8" max="400" value="32" aria-label="글자 크기"><span>px</span></div>
    <div class="opt" style="color:var(--muted);font-size:11px">Ctrl+Enter 또는 바깥 클릭으로 확정, Esc 취소</div>
   </div></div>
  <div class="card"><h3>색</h3><div class="sw" id="sw"></div><input type="color" id="color" value="#000000" title="색 직접 고르기"></div>
  <div class="card"><h3>칠판 색</h3><div class="radios" id="board"></div></div>
  <div class="card"><h3>보기</h3>
   <div class="opt"><label><input type="checkbox" id="vGrid"> 격자</label><select id="gridStep" aria-label="격자 간격"><option value="10">10px</option><option value="20" selected>20px</option><option value="50">50px</option><option value="100">100px</option></select></div>
   <div class="opt"><label><input type="checkbox" id="vRuler"> 눈금</label><select id="rulerUnit" aria-label="눈금 단위"><option value="px">px</option><option value="cm">cm</option><option value="mm">mm</option></select></div></div>
  <div class="card" id="fbCard" hidden><h3>파일 브라우저</h3><div id="fbPath"></div><div class="fb" id="fbList"></div></div>
 </aside>
 <div class="stageWrap" id="stageWrap"><div class="corner"></div><canvas class="ruler" id="rulerH"></canvas><canvas class="ruler" id="rulerV"></canvas>
 <main class="stage" id="stage"><div id="paper"><canvas id="cv" width="1200" height="800"></canvas><canvas id="ov" width="1200" height="800"></canvas><div id="gridLayer"></div></div></main></div>
</div>
<footer><span id="size"></span><span id="pos"></span>
 <span class="zoomBox"><button id="zOut" title="축소 (Ctrl+-)" aria-label="축소">−</button><input type="range" id="zoom" min="25" max="400" step="5" value="100" aria-label="확대/축소"><button id="zIn" title="확대 (Ctrl++)" aria-label="확대">+</button><span id="pct">100%</span><button id="zFit" title="창에 맞추기">맞춤</button><button id="z100" title="실제 크기 (Ctrl+0)">100%</button></span>
 <span class="credit">Produced by yundo</span></footer>
<dialog id="dlg"></dialog>
<dialog id="help"><div class="tabs" id="helpTabs"><button data-t="use" class="on">사용법</button><button data-t="keys">단축키</button><button data-t="about">정보</button></div><div class="body" id="helpBody"></div><div class="btns" style="margin-top:12px"><button class="primary" id="helpClose">닫기</button></div></dialog>

<script>
const $=id=>document.getElementById(id);
const T=window.__TAURI__,invoke=T&&T.core&&T.core.invoke; // 브라우저에서 미리 볼 때는 없다

 const unit=$("rulerUnit").value,scale=PX_PER[unit]*zoom; // 단위 1당 화면 픽셀
 const [major,minors]=STEPS.find(([m])=>m*scale>=60)||STEPS[STEPS.length-1],minor=major/minors;
 const first=Math.floor((0-origin)/scale/minor)*minor,last=(len-origin)/scale;
 for(let v=first;v<=last+minor;v+=minor){const pos=Math.round(origin+v*scale)+.5,isMajor=Math.abs(v/major-Math.round(v/major))<1e-6,tick=isMajor?thick:thick*.45;
  g.beginPath();
  if(horizontal){g.moveTo(pos,thick);g.lineTo(pos,thick-tick)}else{g.moveTo(thick,pos);g.lineTo(thick-tick,pos)}g.stroke();
  if(isMajor){const t=String(Math.round(v*100)/100);
   if(horizontal)g.fillText(t,pos+3,10);else{g.save();g.translate(10,pos-3);g.rotate(-Math.PI/2);g.fillText(t,0,0);g.restore()}}}}
function drawRulers(){if(!$("stageWrap").classList.contains("rulers"))return;drawRuler($("rulerH"),true);drawRuler($("rulerV"),false)}
$("vRuler").onchange=()=>{$("stageWrap").classList.toggle("rulers",$("vRuler").checked);drawRulers()};$("rulerUnit").onchange=drawRulers;
$("stage").addEventListener("scroll",drawRulers);addEventListener("resize",drawRulers);
// ---------- 파일 ----------
function loadImage(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error("이미지를 읽을 수 없습니다"));im.src=src})}
function resetCanvas(w,h,img=null){cv.width=ov.width=w;cv.height=ov.height=h;sel=null;drawSel();applyZoomSoon();ops=[];redo=[];base=img;cur=null;replay()}
function compose(){const c=document.createElement("canvas");c.width=cv.width;c.height=cv.height;const g=c.getContext("2d");
 if(board!=="transparent"){g.fillStyle=board;g.fillRect(0,0,c.width,c.height)}g.drawImage(cv,0,0);return c.toDataURL("image/png")}
async function copyToClipboard(){ // 지금 보이는 그림(칠판 색 포함)을 PNG로 클립보드에 넣는다. 선택 영역이 있으면 그 부분만.
 commitText();
 try{const src=await loadImage(compose()),r=sel&&sel.w>=2&&sel.h>=2?sel:{x:0,y:0,w:src.width,h:src.height};
  const c=document.createElement("canvas");c.width=r.w;c.height=r.h;c.getContext("2d").drawImage(src,r.x,r.y,r.w,r.h,0,0,r.w,r.h);
  const blob=await new Promise(ok=>c.toBlob(ok,"image/png"));
  await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
  toast(sel?"선택 영역을 클립보드에 복사했습니다":"그림을 클립보드에 복사했습니다")}
 catch(e){toast("클립보드 복사 실패: "+(e&&e.message||e))}}
$("bCopy").onclick=copyToClipboard;
function downloadFallback(url,name){const a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove()}
async function saveAs(){
 const url=compose(),suggested=(fileName||"그림").replace(/\.[^.]+$/,"")+".png";
 try{if(!invoke){downloadFallback(url,suggested);setModified(false);toast("내려받기로 저장했습니다");return true}
  const r=await invoke("save_png_as",{dataUrl:url,suggestedName:suggested});if(!r)return false;
  filePath=r.path;fileName=r.name;setModified(false);toast(`저장했습니다: ${r.name}`);return true}
 catch(e){toast(String(e));return false}}
async function save(){if(!filePath||!invoke)return saveAs();
 try{const r=await invoke("save_png_to",{path:filePath,dataUrl:compose()});fileName=r.name;setModified(false);toast(`저장했습니다: ${r.name}`);return true}
 catch(e){toast(String(e));return false}}
async function openFile(){
 if(!await confirmDiscard())return;
 try{let name,url,path=null;
  if(invoke){const r=await invoke("open_image");if(!r)return;({name,data_url:url,path}=r)}
  else{const f=await new Promise(res=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=()=>res(i.files[0]);i.click()});if(!f)return;
   name=f.name;url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
  await applyOpened({name,data_url:url,path})}
 catch(e){toast(String(e.message||e))}}
async function applyOpened({name,data_url,path}){
 const im=await loadImage(data_url);resetCanvas(im.naturalWidth,im.naturalHeight,im);applyZoom();
 filePath=path||null;fileName=name;setModified(false)}
// ---------- 파일 브라우저 ----------
let fbOpen=false;
const ico=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
async function fbLoad(path){
 const list=$("fbList");
 if(!invoke){list.innerHTML='<div style="padding:8px;color:var(--muted)">데스크톱 앱에서만 사용할 수 있습니다</div>';return}
 try{const r=await invoke("list_dir",{path:path||null});$("fbPath").textContent=r.path;list.innerHTML="";
  const add=(html,fn,title)=>{const b=document.createElement("button");b.innerHTML=html;b.title=title||"";b.onclick=fn;list.append(b)};
  if(r.parent)add(ico("up")+" 위 폴더로",()=>fbLoad(r.parent));
  for(const e of r.entries)e.is_dir?add(ico("folder")+" "+esc(e.name),()=>fbLoad(e.path),e.name):add(ico("image")+" "+esc(e.name),()=>openPath(e.path),e.name);
  if(!r.entries.length)list.insertAdjacentHTML("beforeend",'<div style="padding:8px;color:var(--muted)">이미지가 없습니다</div>')}
 catch(e){toast(String(e))}}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function openPath(path){if(!await confirmDiscard())return;try{await applyOpened(await invoke("read_image",{path}))}catch(e){toast(String(e.message||e))}}
function toggleBrowser(){fbOpen=!fbOpen;$("fbCard").hidden=!fbOpen;$("bBrowser").style.background=fbOpen?"rgba(255,255,255,.3)":"";if(fbOpen&&!$("fbList").children.length)fbLoad(null)}
$("bBrowser").onclick=toggleBrowser;
// ---------- 도움말 ----------
const HELP={use:`<h4>기본 사용법</h4><ol><li>왼쪽 <b>도구</b>에서 연필·브러시·도형 등을 고릅니다.</li><li><b>색</b>과 <b>굵기</b>를 정하고 캔버스에서 드래그해 그립니다.</li><li><b>칠판 색</b>은 배경만 바꾸고 그린 그림은 그대로입니다. 투명을 고르면 투명 PNG로 저장됩니다.</li><li>하단 슬라이더나 Ctrl+마우스 휠로 <b>확대/축소</b>(25%~400%)합니다.</li></ol>
 <h4>글씨 쓰기</h4><p><b>텍스트</b> 도구로 캔버스를 클릭하고 키보드로 입력합니다(한글 가능). <b>Ctrl+Enter</b> 또는 바깥 클릭으로 확정, <b>Esc</b>는 취소입니다. 글꼴과 크기는 왼쪽 옵션에서 정합니다.</p>
 <h4>선택과 삭제</h4><p><b>선택</b>으로 영역을 지정하고 <b>Delete</b>를 누르면 지워집니다. <b>영역 삭제</b>는 드래그한 영역을 바로 지웁니다.</p>
 <h4>보기</h4><p>왼쪽 <b>보기</b>에서 격자와 눈금(px·cm·mm)을 켤 수 있고, 상단 <b>파일 브라우저</b>로 폴더의 이미지를 바로 열 수 있습니다.</p>`,
 about:`<h4>그림판 (Rust + Tauri)</h4><p>Produced by yundo</p><p>버전 0.1.0 · 화면은 웹(HTML/JS), 파일 입출력은 Rust가 맡습니다.</p>`};
const KEYS=[["연필","P"],["브러시","B"],["지우개","E"],["직선","L"],["사각형","R"],["타원","O"],["텍스트","T"],["색 채우기","F"],["색 선택","I"],["이동","M"],["선택","S"],["영역 삭제","D"],["선택 영역 삭제","Delete"],["굵기 줄이기/늘리기","[  ]"],["실행 취소","Ctrl+Z"],["다시 실행","Ctrl+Y / Ctrl+Shift+Z"],["새로 만들기","Ctrl+N"],["열기","Ctrl+O"],["클립보드로 복사","Ctrl+Shift+C"],["저장","Ctrl+S"],["다른 이름으로 저장","Ctrl+Shift+S"],["파일 브라우저","Ctrl+B"],["확대 / 축소 / 실제 크기","Ctrl+= / Ctrl+- / Ctrl+0"],["도움말","F1"]];
function showHelpTab(t){document.querySelectorAll("#helpTabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
 $("helpBody").innerHTML=t==="keys"?"<table>"+KEYS.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join("")+"</table>":HELP[t]}
document.querySelectorAll("#helpTabs button").forEach(b=>b.onclick=()=>showHelpTab(b.dataset.t));
function showHelp(){showHelpTab("use");$("help").showModal()}
$("bHelp").onclick=showHelp;$("helpClose").onclick=()=>$("help").close();
// ---------- 창 닫기 전 저장 확인 ----------
function choose(title,message,buttons){ // buttons: [{label,value,primary}] → 고른 value
 return new Promise(res=>{const d=$("dlg");
  d.innerHTML=`<h2></h2><p></p><div class="btns">${buttons.map(b=>`<button${b.primary?' class="primary"':""} value="${b.value}">${b.label}</button>`).join("")}</div>`;
  d.querySelector("h2").textContent=title;d.querySelector("p").textContent=message;d.returnValue="";
  d.onclose=()=>res(d.returnValue||"cancel");d.querySelectorAll("button").forEach(b=>b.onclick=()=>d.close(b.value));d.showModal()})}
async function onCloseRequested(){
 if(!modified){invoke("quit_app");return}
 const c=await choose("저장하지 않은 변경","저장하지 않은 변경 사항이 있습니다. 닫기 전에 저장할까요?",[{label:"취소",value:"cancel"},{label:"저장 안 함",value:"discard"},{label:"저장하고 닫기",value:"save",primary:true}]);
 if(c==="discard"){invoke("quit_app");return}
 if(c==="save"&&await save()){invoke("quit_app");return}
 invoke("close_cancelled")}
if(invoke&&T.event&&T.event.listen)T.event.listen("close-requested",onCloseRequested);
async function newFile(){
 if(!await confirmDiscard())return;
 const d=await ask("새로 만들기","캔버스 크기를 정하세요 (픽셀).",{ok:"만들기",fields:`<label>너비<input type="number" id="nw" min="16" max="8000" value="${cv.width}"></label><label>높이<input type="number" id="nh" min="16" max="8000" value="${cv.height}"></label>`});
 if(!d)return;const w=Math.max(16,Math.min(8000,+d.querySelector("#nw").value||1200)),h=Math.max(16,Math.min(8000,+d.querySelector("#nh").value||800));
 resetCanvas(w,h);filePath=null;fileName="";setModified(false)}
$("bNew").onclick=newFile;$("bOpen").onclick=openFile;$("bSave").onclick=save;$("bSaveAs").onclick=saveAs;
// ---------- 단축키 ----------
const KEY_TOOL={p:"pen",b:"brush",e:"eraser",l:"line",r:"rect",o:"ellipse",t:"text",f:"fill",i:"pick",s:"select",m:"move",d:"cutrect"};
addEventListener("keydown",e=>{
 if(document.querySelector("dialog[open]")||(e.target.matches&&e.target.matches("input,textarea,select")))return;
 const k=e.key.toLowerCase(),mod=e.metaKey||e.ctrlKey;
 if(mod&&k==="z"){e.preventDefault();e.shiftKey?redoIt():undo()}
 else if(mod&&k==="y"){e.preventDefault();redoIt()}
 else if(mod&&e.shiftKey&&k==="c"){e.preventDefault();copyToClipboard()}
 else if(mod&&k==="s"){e.preventDefault();e.shiftKey?saveAs():save()}
 else if(mod&&k==="o"){e.preventDefault();openFile()}
 else if(mod&&k==="n"){e.preventDefault();newFile()}
 else if(mod&&k==="b"){e.preventDefault();toggleBrowser()}
 else if(mod&&(k==="="||k==="+")){e.preventDefault();setZoom(zoom*1.25)}
 else if(mod&&k==="-"){e.preventDefault();setZoom(zoom/1.25)}
 else if(mod&&k==="0"){e.preventDefault();setZoom(1)}
 else if(e.key==="F1"){e.preventDefault();showHelp()}
 else if(!mod&&(e.key==="Delete"||e.key==="Backspace")){e.preventDefault();deleteSelection()}
 else if(!mod&&KEY_TOOL[k]&&!e.altKey)setTool(KEY_TOOL[k]);
 else if(!mod&&k==="[")setWidth(width-(width>10?5:1));
 else if(!mod&&k==="]")setWidth(width+(width>=10?5:1))});

const THEMES=["auto","light","dark"],ICON={auto:"auto",light:"sun",dark:"moon"};
let theme="auto";try{theme=THEMES.includes(localStorage.theme)?localStorage.theme:"auto"}catch(e){}
function applyTheme(){const r=document.documentElement;theme==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",theme);
 $("bTheme").innerHTML=`<svg class="i"><use href="#i-${ICON[theme]}"/></svg>`;$("bTheme").title="화면 테마: "+{auto:"자동",light:"밝게",dark:"어둡게"}[theme];if(typeof drawRulers==="function")drawRulers()}
$("bTheme").onclick=()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%3];try{localStorage.theme=theme}catch(e){}applyTheme()};
