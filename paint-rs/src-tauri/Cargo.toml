[package]
name = "paint-rs"
version = "0.1.0"
edition = "2024"
description = "그림판 (Rust + Tauri)"

[lib]
name = "paint_rs_lib"
path = "src/lib.rs"

[[bin]]
name = "paint-rs"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.5"

[build-dependencies]
tauri-build = "2.7.4"

[dev-dependencies]
tempfile = "3.27.0"
